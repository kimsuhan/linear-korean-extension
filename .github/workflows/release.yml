name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CWS_PUBLISHER_ID: 6fe528a0-bfd0-47c6-a89b-d9e99cd5d5b0
  CWS_ITEM_ID: ihlhiehmdnabfedbhlkheihpnmeejnef

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check manifest version matches tag
        run: |
          version=$(jq -r .version manifest.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "manifest $version != tag $GITHUB_REF_NAME"; exit 1; }
          echo "ZIP=linear-korean-$version.zip" >> "$GITHUB_ENV"

      - name: Build zip
        run: git archive --format=zip -o "$ZIP" HEAD

      - name: Upload to Chrome Web Store
        # shell을 명시해야 pipefail이 켜져 curl 실패가 tee, jq 뒤에 가려지지 않는다
        shell: bash
        env:
          KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        run: |
          # 키로 서명한 JWT를 액세스 토큰으로 바꾼다. 서비스 계정 가장이 아니라서 IAM 역할이 필요 없다
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          claims=$(jq -c --argjson now "$(date +%s)" '{iss: .client_email, scope: "https://www.googleapis.com/auth/chromewebstore",
            aud: "https://oauth2.googleapis.com/token", iat: $now, exp: ($now + 600)}' <<<"$KEY")
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf %s "$claims" | b64)"
          signature=$(printf %s "$unsigned" | openssl dgst -sha256 -sign <(jq -r .private_key <<<"$KEY") | b64)
          response=$(curl -sS -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer -d "assertion=$unsigned.$signature" \
            https://oauth2.googleapis.com/token)
          TOKEN=$(jq -er .access_token <<<"$response") || { echo "$response"; exit 1; }
          echo "::add-mask::$TOKEN"

          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_ITEM_ID"
          api="https://chromewebstore.googleapis.com"
          state=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" -T "$ZIP" \
            "$api/upload/v2/$item:upload" | tee /dev/stderr | jq -r .uploadState)
          # 큰 패키지는 비동기로 처리되므로 끝날 때까지 기다린다
          for _ in $(seq 30); do
            case "$state" in SUCCEEDED) break ;; FAILED|NOT_FOUND) exit 1 ;; esac
            sleep 10
            state=$(curl -sf -H "Authorization: Bearer $TOKEN" "$api/v2/$item:fetchStatus" | jq -r .lastAsyncUploadState)
          done
          [ "$state" = SUCCEEDED ] || exit 1
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{}' "$api/v2/$item:publish" | tee /dev/stderr

      # 실패하기 쉬운 스토어 업로드가 끝난 뒤에 만들어야 재실행이 릴리스 중복으로 막히지 않는다
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --generate-notes
